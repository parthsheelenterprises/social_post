name: Deploy PESoaps to Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-pesoaps-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: pesoaps-production
    defaults:
      run:
        working-directory: pesoaps
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '1fbc90f336ed0cd8f6934c631fb732f4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pesoaps/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply pe-soaps-social-posts --remote
      - name: Deploy Worker and daily trigger
        run: npm run deploy
