name: Deploy PESoaps to Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-pesoaps-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: pesoaps-production
    defaults:
      run:
        working-directory: pesoaps
    env:
      PE_SOAPS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pesoaps/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Deploy Worker and daily trigger
        run: npm run deploy
