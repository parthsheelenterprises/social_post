name: PESoaps checks
on:
  push:
    paths:
      - 'pesoaps/**'
      - '.github/workflows/check.yml'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'pesoaps/**'
      - '.github/workflows/check.yml'
      - '.github/workflows/deploy.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pesoaps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pesoaps/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
