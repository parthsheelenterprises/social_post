name: Import PESoaps product SKUs
on:
  push:
    branches: [main]
    paths: [pesoaps/catalog/product-skus.txt]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-pesoaps-skus
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    environment: pesoaps-production
    defaults:
      run:
        working-directory: pesoaps
    env:
      PE_SOAPS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pesoaps/package-lock.json
      - run: npm ci
      - name: Verify and import new product IDs
        run: npm run catalog:import
      - name: Check catalog and Worker
        run: |
          npm run check
          npm test
          npm run build
      - name: Require PE deployment credential
        run: |
          if [ -z "$PE_SOAPS_CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Configure CLOUDFLARE_API_TOKEN in the pesoaps-production environment. New products were not activated.'
            exit 1
          fi
      - name: Commit verified catalog and photos
        run: |
          git add catalog migrations
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Import verified PESoaps Flipkart SKUs'
            git push
          fi
      - name: Apply new product rows
        run: npm run db:migrate
      - name: Deploy Worker
        run: npm run deploy
